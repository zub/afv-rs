[workspace]
resolver = "3"
members = ["crates/afv-proto", "crates/afv-audio", "crates/afv"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.95"

[workspace.dependencies]
afv-proto = { path = "crates/afv-proto" }
afv-audio = { path = "crates/afv-audio" }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
opus = "0.4"
rubato = "5.0.1"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
rand_distr = "0.6.0"
hound = "3.5"
tokio = "1.47"
tracing = "0.1"
rtrb = "0.4.1"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "json"] }
axum = "0.8"
