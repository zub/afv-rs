[workspace]
resolver = "3"
members = ["crates/afv-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

rust-version = "1.95"

[workspace.dependencies]
afv-proto = { path = "crates/afv-proto" }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
